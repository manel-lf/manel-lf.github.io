<!-- @dsCard group="Colors" viewport="700x150" name="Hairlines" subtitle="Every division in the layout is a 1px rule, not a shadow" -->
<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Hairlines</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div style="border-top:1px solid var(--hairline);padding-top:12px"><span class="meta">hairline #E2E2DE — section rules, card edges</span></div>
<div style="border-top:1px solid var(--hairline-strong);padding-top:12px"><span class="meta">hairline-strong #CFCFC9 — inputs, chips, controls</span></div>
<div style="border-top:1px solid var(--ink);padding-top:12px"><span class="meta">ink — hover border on a control</span></div></div></body></html>
