<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="4 / 8 / 12 / pill. Cards are 12; everything interactive is a pill" -->
<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div class="row"><div style="width:96px;height:64px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:4px;display:grid;place-items:center"><span class="meta">r-sm</span></div><div style="width:96px;height:64px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:8px;display:grid;place-items:center"><span class="meta">r-md</span></div><div style="width:96px;height:64px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:12px;display:grid;place-items:center"><span class="meta">r-lg</span></div><div style="width:130px;height:40px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:999px;display:grid;place-items:center"><span class="meta">r-pill</span></div></div></div></body></html>
