<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Accent</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div class="sw"><div style="background:#2145E6;color:#FFFFFF"><span class="n">accent light #2145E6</span></div><div style="background:#5B77FF;color:#08080C"><span class="n">accent dark #5B77FF</span></div></div><div class="row"><span class="meta" style="color:var(--accent)">Design systems</span><a href="#" class="textLink">a link on hover</a><span style="display:inline-block;width:3px;height:22px;background:var(--accent)"></span><span class="meta">caret · focus ring · kicker</span></div></div></body></html>
