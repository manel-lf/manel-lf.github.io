<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Layout</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div style="border:1px dashed var(--hairline-strong);border-radius:var(--r-md);padding:0 clamp(20px,5vw,64px)"><div style="border-left:1px solid var(--accent);border-right:1px solid var(--accent);padding:20px 0;text-align:center"><span class="meta">max-width 1240px</span></div></div>
