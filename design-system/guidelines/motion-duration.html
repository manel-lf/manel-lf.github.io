<!-- @dsCard group="Motion" viewport="700x160" name="Duration" subtitle="150–400ms for UI; longer only for deliberate reveals" -->
<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Duration</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div style="display:grid;gap:10px">
<div style="display:flex;gap:12px;align-items:baseline"><span class="mono" style="min-width:110px">dur-fast</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2);min-width:60px">150ms</span><span class="meta">scroller controls, focus</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="mono" style="min-width:110px">dur-base</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2);min-width:60px">220ms</span><span class="meta">hover, arrows, colour</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="mono" style="min-width:110px">dur-slow</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2);min-width:60px">320ms</span><span class="meta">card lift, theme cross-fade</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="mono" style="min-width:110px">dur-reveal</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2);min-width:60px">560ms</span><span class="meta">scroll reveal, media scale</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="mono" style="min-width:110px">dur-hero</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2);min-width:60px">720ms</span><span class="meta">hero word mask, shared-element flight</span></div></div></div></body></html>
