<!-- @dsCard group="Colors" viewport="700x140" name="Panel set" subtitle="The inverted surface used by the spotlight, About card and system panel" -->
<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Panel</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div class="sw"><div style="background:#0E0E0E;color:#F4F4F2"><span class="n">panel #0E0E0E</span></div><div style="background:#242424;color:#F4F4F2"><span class="n">panel-hairline #242424</span></div><div style="background:#9A9A96;color:#0A0A0A"><span class="n">panel-muted #9A9A96</span></div><div style="background:#F4F4F2;color:#0A0A0A"><span class="n">panel-ink #F4F4F2</span></div></div></div></body></html>
