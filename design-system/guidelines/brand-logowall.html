<!-- @dsCard group="Brand" viewport="700x180" name="Client marks" subtitle="Ten client logos, masked over currentColor so one file serves both themes" -->
<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Client marks</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:24px 20px;align-items:center">
<span class="brandmark" style="width:122px;height:15px;max-width:100%;mask-image:url(../assets/logos/gamehouse.svg);-webkit-mask-image:url(../assets/logos/gamehouse.svg)"></span><span class="brandmark" style="width:115px;height:35px;max-width:100%;mask-image:url(../assets/logos/jesterday.svg);-webkit-mask-image:url(../assets/logos/jesterday.svg)"></span><span class="brandmark" style="width:132px;height:11px;max-width:100%;mask-image:url(../assets/logos/eunoiadigital.svg);-webkit-mask-image:url(../assets/logos/eunoiadigital.svg)"></span><span class="brandmark" style="width:130px;height:22px;max-width:100%;mask-image:url(../assets/logos/popcore.svg);-webkit-mask-image:url(../assets/logos/popcore.svg)"></span><span class="brandmark" style="width:143px;height:20px;max-width:100%;mask-image:url(../assets/logos/cupra.svg);-webkit-mask-image:url(../assets/logos/cupra.svg)"></span><span class="brandmark" style="width:117px;height:24px;max-width:100%;mask-image:url(../assets/logos/socialpoint.svg);-webkit-mask-image:url(../assets/logos/socialpoint.svg)"></span><span class="brandmark" style="width:118px;height:34px;max-width:100%;mask-image:url(../assets/logos/lasalle.svg);-webkit-mask-image:url(../assets/logos/lasalle.svg)"></span><span class="brandmark" style="width:127px;height:23px;max-width:100%;mask-image:url(../assets/logos/kavehome.svg);-webkit-mask-image:url(../assets/logos/kavehome.svg)"></span><span class="brandmark" style="width:112px;height:24px;max-width:100%;mask-image:url(../assets/logos/murisbrand.svg);-webkit-mask-image:url(../assets/logos/murisbrand.svg)"></span><span class="brandmark" style="width:97px;height:36px;max-width:100%;mask-image:url(../assets/logos/radisson.svg);-webkit-mask-image:url(../assets/logos/radisson.svg)"></span>
</div></div></body></html>
