<!-- @dsCard group="Motion" viewport="700x160" name="Easing" subtitle="Decisive start, long settle. One restrained spring" -->
<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Easing</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div style="display:grid;gap:10px">
<div style="display:flex;gap:12px;align-items:baseline"><span class="mono" style="min-width:110px">ease-out</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">cubic-bezier(0.16, 1, 0.3, 1)</span><span class="meta">entrances, reveals, hover lifts</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="mono" style="min-width:110px">ease-std</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">cubic-bezier(0.4, 0, 0.2, 1)</span><span class="meta">colour and opacity</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="mono" style="min-width:110px">ease-spring</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">cubic-bezier(0.34, 1.32, 0.64, 1)</span><span class="meta">rail pill, theme knob only</span></div></div></div></body></html>
