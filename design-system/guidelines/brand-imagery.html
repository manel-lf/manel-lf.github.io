<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Imagery</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
<img src="../assets/img/manel-portrait.jpg" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-md)">
<img src="../assets/img/scavenger-hunt-thumbnail.jpg" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-md)">
<div style="position:relative;border-radius:var(--r-md);overflow:hidden"><img src="../assets/img/journal-tcebc-tool.jpg" alt="" style="width:100%;aspect-ratio:1;object-fit:cover"><span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,.55) 0%,rgba(5,5,5,.35) 45%,rgba(5,5,5,.9) 100%)"></span><span class="mono" style="position:absolute;left:10px;bottom:8px;color:#F4F4F2">protection gradient</span></div>
</div></div></body></html>
