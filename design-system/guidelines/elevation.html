<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Two shadows: a hairline at rest, a wide downward lift on hover" -->
<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-display)}.wrap{display:flex;flex-direction:column;gap:12px}.sw{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}.sw>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.sw .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}</style></head><body><div class="wrap"><div class="row" style="padding:8px 0 24px">
<div style="width:200px;height:88px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow-card);display:grid;place-items:center"><span class="meta">rest · shadow-card</span></div>
<div style="width:200px;height:88px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-lift);transform:translateY(-4px);display:grid;place-items:center"><span class="meta">hover · shadow-lift</span></div></div>
<span class="meta">0 1px 2px rgba(10,10,10,.04) → 0 18px 40px -18px rgba(10,10,10,.22), card lifts 4px</span></div></body></html>
