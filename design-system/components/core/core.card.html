<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--canvas)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:20px}.panelRow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--panel);border-radius:var(--r-lg);padding:20px;margin-bottom:20px}.cap{color:var(--muted);margin-bottom:8px;display:block}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = window.ManelLPezPortfolioDesignSystem_30aec3;
const { Button, IconButton, MonoLabel, Chip, TextLink, ThemeToggle, Monogram, Icon, Avatar, Wordmark } = NS;
function Card(){
  const [theme,setTheme]=React.useState('light');
  React.useEffect(()=>{document.documentElement.dataset.theme=theme},[theme]);
  return (<div>
    <MonoLabel tone="muted" className="cap">On canvas</MonoLabel>
    <div className="row">
      <Monogram letter="M" />
      <Button variant="ink" size="sm" href="#">Book a call</Button>
      <Button variant="ink" type="submit">Send message</Button>
      <Button variant="ink" disabled>Sending…</Button>
      <ThemeToggle theme={theme} onToggle={()=>setTheme(t=>t==='dark'?'light':'dark')} />
    </div>
    <MonoLabel tone="muted" className="cap">On panel</MonoLabel>
    <div className="panelRow">
      <Button variant="inverse" href="#">View case</Button>
      <Button variant="panel" leadingIcon="linkedin" icon="arrowUpRight" href="#">LinkedIn</Button>
      <Button variant="ghost" leadingIcon="behance" icon="arrowUpRight" href="#">Behance</Button>
    </div>
    <MonoLabel tone="muted" className="cap">Icon buttons, chips, labels, links</MonoLabel>
    <div className="row">
      <span className="arrowPair"><IconButton icon="chevronLeft" label="Previous" disabled /><IconButton icon="chevronRight" label="Next" /></span>
      <IconButton variant="social" icon="mail" label="Email" href="#" />
      <IconButton variant="social" icon="linkedin" label="LinkedIn" href="#" />
      <span className="chips"><Chip>Process</Chip><Chip>Prototyping</Chip><Chip>AI Tooling</Chip></span>
      <MonoLabel tone="accent">Design systems</MonoLabel>
      <TextLink href="#">manellopez.alu@gmail.com</TextLink>
      <Avatar name="Emmi Kuusikko" src="../../assets/img/testimonial-emmi-kuusikko.jpg" />
      <Icon name="arrowUpRight" />
      <Wordmark src="../../assets/logos/gamehouse.svg" name="GameHouse" aspect={8.201} scale={0.62} />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
