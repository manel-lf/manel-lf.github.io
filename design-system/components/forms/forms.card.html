<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--canvas)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Field, Button } = window.ManelLPezPortfolioDesignSystem_30aec3;
function Demo(){
  const [v,setV]=React.useState({name:'Manel',email:'not-an-email',message:''});
  const set=k=>e=>setV({...v,[k]:e.target.value});
  return (<form className="form" onSubmit={e=>e.preventDefault()}>
    <Field name="name" label="Your name" value={v.name} placeholder="Hiring Manager" onChange={set('name')} />
    <Field name="email" label="Your email" type="email" value={v.email} placeholder="you@company.com" invalid error="Please enter a valid email address." onChange={set('email')} />
    <Field name="message" label="Message" textarea full rows={2} value={v.message} placeholder="A line or two about the team, the product and the problem." onChange={set('message')} />
    <div className="formFoot">
      <Button type="submit" variant="ink">Send message</Button>
      <span className="formStatus mono">Validates on blur</span>
    </div>
  </form>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
