<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}body{margin:0;background:var(--canvas);position:relative}.nav{position:absolute}.railDock{position:absolute}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { NavBar, SectionRail } = window.ManelLPezPortfolioDesignSystem_30aec3;
const ITEMS=[{id:"work",label:"Work"},{id:"bits",label:"Bits"},{id:"about",label:"About"},{id:"shoutouts",label:"Shoutouts"},{id:"journal",label:"Journal"},{id:"contact",label:"Contact"}];
function Demo(){
  const [theme,setTheme]=React.useState('light');
  const [active,setActive]=React.useState('bits');
  React.useEffect(()=>{document.documentElement.dataset.theme=theme},[theme]);
  return (<>
    <NavBar theme={theme} onToggleTheme={()=>setTheme(t=>t==='dark'?'light':'dark')} ctaHref="#" onCta={e=>e.preventDefault()} />
    <SectionRail items={ITEMS} activeId={active} onSelect={setActive} />
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
